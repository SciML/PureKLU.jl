name: "Documentation"

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch || github.ref != 'refs/tags/v*' }}

jobs:
  build-and-deploy-docs:
    name: "Documentation"
    uses: "SciML/.github/.github/workflows/documentation.yml@v1"
    secrets: "inherit"
    with:
      # Skip Codecov upload: the docs build itself succeeds, but the reusable
      # workflow hardcodes `fail_ci_if_error: true`, so the upload fails the job
      # until PureKLU.jl is onboarded to Codecov. Re-enable once it is.
      coverage: false
