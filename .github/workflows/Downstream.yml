name: IntegrationTest
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

jobs:
  test:
    # Disabled until a package actually depends on PureKLU. Because PureKLU's
    # deps are compatible with LinearSolve's, `Pkg.develop` + `Pkg.test` would
    # NOT hit a ResolverError (the usual "incompatible -> pass" no-op); it would
    # instead run LinearSolve's full test suite on every PureKLU PR. Flip this
    # to `true` once LinearSolve.jl (or another consumer) adds PureKLU as a dep.
    if: false
    name: ${{ matrix.package.repo }}/${{ matrix.package.group }}/${{ matrix.julia-version }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1']
        package:
          - {user: SciML, repo: LinearSolve.jl, group: Core}
    uses: "SciML/.github/.github/workflows/downstream.yml@v1"
    with:
      julia-version: "${{ matrix.julia-version }}"
      julia-arch: "x64"
      owner: "${{ matrix.package.user }}"
      repo: "${{ matrix.package.repo }}"
      group: "${{ matrix.package.group }}"
      coverage: false
    secrets: "inherit"
